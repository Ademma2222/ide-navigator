name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: ide-navigator/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Swift parser недоступен на Linux → устанавливаем остальные руками
          pip install pygls==2.1.1 tree-sitter==0.25.2 \
            tree-sitter-python tree-sitter-java tree-sitter-cpp \
            tree-sitter-go tree-sitter-javascript tree-sitter-typescript \
            pytest

      - name: Run pytest
        run: pytest -v
